[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gdc2maf"
dynamic = ["version"]
description = "From a GDC cohort specification to one verified, merged MAF"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ali Farnudi" }]
keywords = ["GDC", "TCGA", "MAF", "somatic mutations", "bioinformatics", "cohort"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
docs = [
    "sphinx>=7",
    "myst-parser>=2",
    "sphinx-argparse>=0.4",
    "sphinx-design>=0.5",
    "furo>=2024.1.29",
]

[project.scripts]
gdc2maf = "gdc2maf.cli:main"

[project.urls]
Source = "https://github.com/afarnudi/gdc2maf"

[tool.hatch.version]
path = "src/gdc2maf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gdc2maf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
